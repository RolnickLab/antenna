services:
  ml_backend_bioclip:
    build:
      context: .
    volumes:
      - ./:/app:z
      - ./huggingface_cache:/root/.cache/huggingface
      - ./pytorch_cache:/root/.cache/torch
    ports:
      - "2004:2000"
    extra_hosts:
      - minio:host-gateway
    networks:
      - antenna_network
