name: Production Image Build

# Checks that the production Django image still builds when its inputs change.
# Application code is left out of the path filter on purpose. The build does
# load Django while compiling translations, so a broken import can fail it, but
# the backend tests already catch that on every code change.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "compose/production/**"
      - "requirements/**"
      - "locale/**"
      - "docker-compose.production.yml"
      - "docker-compose.worker.yml"
      - ".dockerignore"
      - ".github/workflows/build.production.yml"

  push:
    branches: ["main"]
    paths:
      - "compose/production/**"
      - "requirements/**"
      - "locale/**"
      - "docker-compose.production.yml"
      - "docker-compose.worker.yml"
      - ".dockerignore"
      - ".github/workflows/build.production.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The worker compose file builds from the same Dockerfile, so this one
      # build covers both the web and worker images.
      - name: Build the production Django image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/django/Dockerfile
          push: false
          load: true
          tags: antenna-backend:dependency-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches a dependency that installs but fails to import. The entrypoint
      # is bypassed because it waits for a database that does not exist here.
      - name: Check that core dependencies import
        run: docker run --rm --entrypoint python antenna-backend:dependency-check -c "import django, celery, rest_framework"
